# Runs the image published by CI (ghcr.io) instead of building locally.
# This is the compose default; use `docker compose -f _compose.yml ...`
# to build from source instead.
services:
  homophony:
    image: ghcr.io/m-pilarski/homophony:latest
    container_name: homophony
    restart: unless-stopped
    network_mode: host
    # Pin the resolver instead of inheriting whatever the host's
    # /etc/resolv.conf happened to say when the container was created. At boot
    # dockerd can start the container before the host has real nameservers, and
    # with host networking there is no embedded Docker resolver to fall back on,
    # so the container is left with an empty resolv.conf for its whole lifetime —
    # snapcast keeps working (SNAPSERVER is an IP) while Spotify and UPnP are
    # silently dead. Leave DNS_SERVERS unset to keep Docker's default behaviour;
    # compose then drops this key entirely.
    dns:
      - ${DNS_SERVERS:-}
    device_cgroup_rules:
      - "c 116:* rmw"
    # Opt-in GPIO access for the amplifier trigger relay (ENABLE_AMP_TRIGGER=1).
    # Set AMP_TRIGGER_DEVICE=/dev/gpiochip0:/dev/gpiochip0 on a host that has the
    # relay wired up; the default maps /dev/null onto itself, which is a harmless
    # no-op on hosts without one. Going through devices: rather than a bind mount
    # is what grants the cgroup permission for the chip's dynamic major.
    devices:
      - ${AMP_TRIGGER_DEVICE:-/dev/null:/dev/null}
    environment:
      ROOM_NAME: ${ROOM_NAME:-Room}
      MULTIROOM_NAME: ${MULTIROOM_NAME:-Multiroom}
      SNAPSERVER: ${SNAPSERVER:-snapserver.local}
      SNAPSERVER_CONTROL_PORT: ${SNAPSERVER_CONTROL_PORT:-1705}
      ALSA_SINK: ${ALSA_SINK:-default}
      DOWNMIX_TO_MONO: ${DOWNMIX_TO_MONO:-0}
      ENABLE_SNAPCLIENT: ${ENABLE_SNAPCLIENT:-1}
      ENABLE_SNAPSERVER: ${ENABLE_SNAPSERVER:-0}
      ENABLE_SPOTIFY: ${ENABLE_SPOTIFY:-1}
      ENABLE_UPNP: ${ENABLE_UPNP:-1}
      SPOTIFY_INITIAL_VOLUME: ${SPOTIFY_INITIAL_VOLUME:-70}
      MULTIROOM_SPOTIFY_INITIAL_VOLUME: ${MULTIROOM_SPOTIFY_INITIAL_VOLUME:-100}
      SPOTIFYD_DEVICE: ${SPOTIFYD_DEVICE:-audio_output}
      UPNP_DEVICE: ${UPNP_DEVICE:-}
      SPOTIFY_USE_MPRIS: ${SPOTIFY_USE_MPRIS:-1}
      ENABLE_AUDIO_PRIORITY: ${ENABLE_AUDIO_PRIORITY:-1}
      AUDIO_PRIORITY_GRACE_SECONDS: ${AUDIO_PRIORITY_GRACE_SECONDS:-10}
      AUDIO_PRIORITY_RESUME_SPOTIFY: ${AUDIO_PRIORITY_RESUME_SPOTIFY:-0}
      ENABLE_AMP_TRIGGER: ${ENABLE_AMP_TRIGGER:-0}
      AMP_TRIGGER_CHIP: ${AMP_TRIGGER_CHIP:-gpiochip0}
      AMP_TRIGGER_GPIO: ${AMP_TRIGGER_GPIO:-17}
      AMP_TRIGGER_ACTIVE_LOW: ${AMP_TRIGGER_ACTIVE_LOW:-0}
      AMP_TRIGGER_IDLE_SECONDS: ${AMP_TRIGGER_IDLE_SECONDS:-60}
      AMP_TRIGGER_INTERVAL: ${AMP_TRIGGER_INTERVAL:-2}
      AMP_TRIGGER_SINK: ${AMP_TRIGGER_SINK:-audio_output}
      HEALTHCHECK_TOLERANCE_SECONDS: ${HEALTHCHECK_TOLERANCE_SECONDS:-600}
      HEALTHCHECK_DNS_NAME: ${HEALTHCHECK_DNS_NAME:-}
      SNAPCLIENT_EXTRA_ARGS: ${SNAPCLIENT_EXTRA_ARGS:-}
      SNAPSERVER_EXTRA_ARGS: ${SNAPSERVER_EXTRA_ARGS:-}
      SPOTIFYD_EXTRA_ARGS: ${SPOTIFYD_EXTRA_ARGS:-}
      UPMPDCLI_EXTRA_ARGS: ${UPMPDCLI_EXTRA_ARGS:-}
    tmpfs:
      - /tmp
      - /run:exec
    group_add:
      - "${AUDIO_GID:-29}"
    volumes:
      - ${AUDIO_DEVICE:-/dev/snd}:/dev/snd
      - data:/var/lib/homophony
    labels:
      # Restarted by the autoheal companion when the image HEALTHCHECK
      # (homophony-healthcheck) reports unhealthy.
      - autoheal=true
      # Opted in to the watchtower stack, which runs with
      # WATCHTOWER_LABEL_ENABLE=true and so only updates containers carrying
      # this label. Safe here because compose.yml runs the CI image from
      # ghcr.io; the _compose.yml build variant is deliberately not labelled.
      - com.centurylinklabs.watchtower.enable=true

  # Watches this host's containers and restarts any labelled autoheal=true
  # that Docker marks unhealthy. Docker does not restart on health alone.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: homophony-autoheal
    restart: unless-stopped
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL:-30}
      AUTOHEAL_START_PERIOD: ${AUTOHEAL_START_PERIOD:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  data: {}
